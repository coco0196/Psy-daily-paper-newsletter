name: Download tracker metadata

on:
  schedule:
    # 每周一 UTC 4:00 = 北京时间 12:00（GitHub cron 使用 UTC）
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      start_date:
        description: '周报起始日期 (YYYY-MM-DD)，留空则自动取上周一'
        required: false
        type: string
      end_date:
        description: '周报结束日期 (YYYY-MM-DD)，留空则自动取上周日'
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    outputs:
      download_status: ${{ steps.download.outputs.status }}
      start_date: ${{ steps.set-date.outputs.start_date }}
      end_date: ${{ steps.set-date.outputs.end_date }}
      weekly_key: ${{ steps.set-date.outputs.weekly_key }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set weekly date range
      id: set-date
      run: |
        export TZ='Asia/Shanghai'
        if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
          START_DATE="${{ github.event.inputs.start_date }}"
          END_DATE="${{ github.event.inputs.end_date }}"
        else
          read START_DATE END_DATE <<< $(python -c "from utils import get_last_week_range; s,e=get_last_week_range(); print(s, e)")
        fi
        WEEKLY_KEY="${START_DATE}_to_${END_DATE}"
        echo "start_date=$START_DATE" >> $GITHUB_OUTPUT
        echo "end_date=$END_DATE" >> $GITHUB_OUTPUT
        echo "weekly_key=$WEEKLY_KEY" >> $GITHUB_OUTPUT
        printf '%s\n%s\n%s' "$START_DATE" "$END_DATE" "$WEEKLY_KEY" > weekly_range.txt
    
    - name: Download paper metadata
      id: download
      env:
        START_DATE: ${{ steps.set-date.outputs.start_date }}
        END_DATE: ${{ steps.set-date.outputs.end_date }}
        NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        JOURNAL_FILTER_ENABLED: ${{ vars.JOURNAL_FILTER_ENABLED }}
      run: |
        python Paper_metadata_download.py --start-date "$START_DATE" --end-date "$END_DATE"
        DOWNLOAD_STATUS=$?
        WEEKLY_FILE="Paper_metadata_download/${START_DATE}_to_${END_DATE}_weekly.json"
        if [ $DOWNLOAD_STATUS -eq 0 ]; then
          if [ -f "$WEEKLY_FILE" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=no_data" >> $GITHUB_OUTPUT
          fi
        else
          echo "status=error" >> $GITHUB_OUTPUT
        fi
    
    - name: Check download result
      id: check
      run: |
        if [ "${{ steps.download.outputs.status }}" == "success" ]; then
          echo "Papers downloaded successfully"
          echo "status=success" >> $GITHUB_OUTPUT
        elif [ "${{ steps.download.outputs.status }}" == "no_data" ]; then
          echo "No papers available for this week"
          echo "status=no_data" >> $GITHUB_OUTPUT
        else
          echo "Download failed"
          echo "status=error" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: Upload workflow data
      uses: actions/upload-artifact@v4
      with:
        name: workflow-data
        path: weekly_range.txt
        retention-days: 1
        
    - name: Commit and push if there are changes
      if: steps.check.outputs.status == 'success'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git fetch origin main
        git reset --hard origin/main
        git add Paper_metadata_download/
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        git commit -m "Update weekly paper metadata for ${{ steps.set-date.outputs.start_date }} to ${{ steps.set-date.outputs.end_date }}"
        
        n=0
        until [ $n -ge 3 ]
        do
          git push origin main && break
          n=$[$n+1]
          if [ $n -lt 3 ]; then
            git fetch origin main
            git reset --hard origin/main
            git add Paper_metadata_download/
            git commit -m "Update weekly paper metadata for ${{ steps.set-date.outputs.start_date }} to ${{ steps.set-date.outputs.end_date }}"
          fi
          sleep 5
        done
