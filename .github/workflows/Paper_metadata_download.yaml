name: Download tracker metadata


on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '周报起始日期 (YYYY-MM-DD)，留空则自动取上周一'
        required: false
        type: string
      end_date:
        description: '周报结束日期 (YYYY-MM-DD)，留空则自动取上周日'
        required: false
        type: string


permissions:
  contents: read


jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set weekly date range
        id: set-date
        shell: bash
        run: |
