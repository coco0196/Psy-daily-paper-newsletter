name: Generate three-track Newsletter

on:
  workflow_run:
    workflows: ["Download tracker metadata"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  process:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download processing data
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.data.artifacts.find(item => item.name === 'workflow-data');
            if (!artifact) core.setFailed('未找到候选文献 artifact');
            const response = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            require('fs').writeFileSync('workflow-data.zip', Buffer.from(response.data));
      - name: Generate Newsletter
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          unzip -o workflow-data.zip
          START_DATE=$(sed -n '1p' weekly_range.txt)
          END_DATE=$(sed -n '2p' weekly_range.txt)
          WEEKLY_KEY=$(sed -n '3p' weekly_range.txt)
          python Psy-day-paper-deepseek.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --weekly-key "$WEEKLY_KEY"
      - name: Commit Newsletter only
        run: |
          WEEKLY_KEY=$(sed -n '3p' weekly_range.txt)
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "newsletters/${WEEKLY_KEY}_weekly_paper.md" "newsletters/${WEEKLY_KEY}_weekly_paper.html"
          if git diff --cached --quiet; then
            echo "No Newsletter changes to commit"
            exit 0
          fi
          git commit -m "Update Newsletter for ${WEEKLY_KEY}"
          git pull --rebase origin main
          git push origin main
