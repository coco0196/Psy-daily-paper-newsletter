name: Apply approved tracker sync and cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated source and remove obsolete artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          root = Path.cwd()
          bundle = root / "sync_payload.zip"
          staging = root / "__sync_payload"
          if not bundle.is_file():
              raise RuntimeError("Missing approved source bundle: sync_payload.zip")

          if staging.exists():
              shutil.rmtree(staging)
          with zipfile.ZipFile(bundle) as archive:
              archive.extractall(staging)

          for source in staging.rglob("*"):
              if source.is_file():
                  destination = root / source.relative_to(staging)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)

          for relative in (
              "audio", "images", "logs", "posters", "stats", "__pycache__", "venv",
          ):
              target = root / relative
              if target.exists():
                  shutil.rmtree(target)

          for relative in (
              "stats.py", "README_CN.md", "psy_logo.jpg", "date.txt",
              "weekly_range.txt", "workflow-data.zip",
          ):
              (root / relative).unlink(missing_ok=True)

          keep = {
              "Paper_metadata_download/2026-08-24_to_2026-08-30_weekly.json",
              "Psy-day-paper-deepseek/2026-08-24_to_2026-08-30_Psy_deepseek_clean.json",
              "newsletters/2026-08-24_to_2026-08-30_weekly_paper.md",
              "newsletters/2026-08-24_to_2026-08-30_weekly_paper.html",
          }
          for directory in (
              "Paper_metadata_download", "Psy-day-paper-deepseek", "newsletters",
          ):
              base = root / directory
              if not base.exists():
                  continue
              for path in sorted(base.rglob("*"), reverse=True):
                  if path.is_file() and path.relative_to(root).as_posix() not in keep:
                      path.unlink()
                  elif path.is_dir() and not any(path.iterdir()):
                      path.rmdir()

          shutil.rmtree(staging, ignore_errors=True)
          bundle.unlink(missing_ok=True)
          (root / ".github/workflows/apply-approved-sync-cleanup.yml").unlink(missing_ok=True)
          PY

      - name: Commit the approved sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "同步三主线文献追踪并清理历史产物"
          git push
